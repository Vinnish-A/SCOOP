[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoop-operating-protocol"
version = "0.3.0"
description = "SCOOP: Single Cell Omics Operating Protocol for robust, auditable single cell omics workflows."
requires-python = ">=3.11,<3.13"
license = "GPL-3.0-or-later"
dependencies = [
  "anndata>=0.10",
  "scanpy>=1.10",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "pyarrow>=14.0",
  "matplotlib>=3.7",
  "harmonypy>=2.0,<3",
  "torch>=2.0",
  "lifelines>=0.30"
]

[project.scripts]
fastde = "fastde.cli:main"
fastcnmf = "fastcnmf.cli:main"
fastcnvpy = "fastcnvpy.cli:main"
fastcore = "fastcore.cli:main"
scoop = "scoop.cli:main"

[project.optional-dependencies]
full = [
  "fastccc",
  "cellphonedb",
  "liana",
  "spatialdata"
]
omicverse = [
  "squidpy>=1.4",
  "scvi-tools>=1.1",
  "omicverse>=2.0",
  "spatialdata"
]
atlas = [
  "scvi-tools>=1.3,<2",
  "scarches>=0.6,<0.7"
]
spatial = [
  "squidpy>=1.4",
  "spatialdata"
]
ccc = [
  "fastccc",
  "cellphonedb",
  "liana"
]
dev = [
  "pytest>=8",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-PyYAML>=6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scoop = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", ".git", ".venv*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["third_party", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = "^(third_party|tmp)/"
