[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoop-operating-protocol"
version = "0.4.0"
description = "SCOOP: Single Cell Omics Operating Protocol for robust, auditable single cell omics workflows."
requires-python = ">=3.11,<3.12"
license = "GPL-3.0-or-later"
dependencies = [
  "anndata>=0.10,<0.12",
  "scanpy>=1.10,<1.12",
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "scipy>=1.10,<1.17",  # AnnData <0.12 uses the pre-1.17 sparse indexing API
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "pyarrow>=14.0",
  "matplotlib>=3.7",
  "harmonypy>=2.0,<3",
  "torch>=2.0,<3",
  "lifelines>=0.30"
]

[project.scripts]
fastde = "fastde.cli:main"
fastcnmf = "fastcnmf.cli:main"
fastcnvpy = "fastcnvpy.cli:main"
fastcore = "fastcore.cli:main"
scoop = "scoop.cli:main"
scoop-fastccc = "scoop.fastccc_cli:main"

[project.optional-dependencies]
runtime = [
  "networkit>=11.1,<12",
  "rctd-py==0.3.9",
  "cnmf==1.7.1",
  "anndataoom==0.1.8",
  "cellphonedb==5.0.1",
  "cupy-cuda12x>=13,<14; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "fastccc==1.0.1",
  "liana==1.8.1",
  "omicverse==2.3.1",
  "scarches==0.6.1",
  "scvi-tools==1.4.2",
  "setuptools<81",
  "spatialdata==0.5.0",
  "squidpy==1.6.6"
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-PyYAML>=6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scoop = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", ".git", ".venv*"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["third_party", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = "^(third_party|tmp)/"
